<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
    /* ===== 個人的年度代表馬(style.cssの緑基調・白カードに合わせたデザイン) ===== */
    .horse-section.hoy-section{width:100%;max-width:860px;align-items:stretch;margin-bottom:60px;}
    .hoy-section .category-header{align-self:flex-start;margin-bottom:24px;}
    .hoy-lead{margin:0 0 20px;font-size:1rem;line-height:1.8;color:#666;}

    .hoy-controls{display:flex;gap:10px;margin-bottom:24px;}
    .hoy-controls button{padding:8px 24px;border-radius:25px;cursor:pointer;font-size:.95rem;font-weight:bold;
        border:1px solid #ccc;background:#f5f5f5;color:#666;transition:all .2s ease;}
    .hoy-controls button.primary{background:#2e7d32;border-color:#2e7d32;color:#fff;}
    .hoy-controls button:hover{filter:brightness(.95);}

    .hoy-card{margin-bottom:16px;background:#fff;border-radius:20px;overflow:hidden;
        box-shadow:0 8px 20px rgba(0,0,0,.08);transition:box-shadow .3s ease;}
    .hoy-card:hover{box-shadow:0 12px 28px rgba(0,0,0,.14);}

    /* 細いバナー(写真を背景にする。写真がない年は緑の背景) */
    .hoy-card summary{display:flex;align-items:center;gap:20px;min-height:96px;padding:14px 26px;
        cursor:pointer;list-style:none;color:#fff;
        background-color:#004d40;background-image:linear-gradient(120deg,#004d40 0%,#00695c 100%);
        background-size:cover;background-position:center 30%;-webkit-tap-highlight-color:transparent;}
    .hoy-card summary::-webkit-details-marker{display:none;}
    .hoy-year{flex:none;min-width:3.4em;font-family:'Noto Serif JP',serif;font-size:1.6rem;font-weight:700;
        text-shadow:0 2px 8px rgba(0,0,0,.6);}
    .hoy-year small{font-size:.85rem;margin-left:1px;}
    .hoy-main{flex:1;min-width:0;}
    .hoy-name{display:block;font-family:'Noto Serif JP',serif;font-size:1.3rem;font-weight:700;
        text-shadow:0 2px 8px rgba(0,0,0,.7);}
    .hoy-race{display:block;margin-top:3px;font-size:.9rem;color:#f0e2b0;text-shadow:0 1px 6px rgba(0,0,0,.8);}
    .hoy-race::before{content:"◆ ";color:#f0c75e;font-size:.7rem;}
    .hoy-arrow{flex:none;font-size:.9rem;text-shadow:0 1px 4px rgba(0,0,0,.6);transition:transform .25s ease;}
    .hoy-card[open] .hoy-arrow{transform:rotate(180deg);}

    /* 開いたとき:写真全体 + 理由 */
    .hoy-body{padding:20px 26px 26px;}
    .hoy-fullpic{display:block;width:100%;height:auto;border-radius:12px;margin-bottom:18px;}
    .hoy-body p{margin:0;font-size:1rem;line-height:1.9;color:#333;}
    .hoy-official{display:inline-block;margin-top:14px;font-size:.85rem;color:#2e7d32;background:#e8f5e9;
        padding:4px 12px;border-radius:6px;font-weight:bold;}

    @media (max-width:700px){
        .horse-section.hoy-section{margin-bottom:40px;}
        .hoy-lead{font-size:.9rem;}
        .hoy-card{border-radius:16px;}
        .hoy-card summary{gap:12px;padding:12px 16px;min-height:88px;}
        .hoy-year{font-size:1.25rem;}
        .hoy-name{font-size:1.05rem;}
        .hoy-race{font-size:.8rem;}
        .hoy-body{padding:16px;}
        .hoy-card:hover{box-shadow:0 8px 20px rgba(0,0,0,.08);}
    }
    </style>
</head>

    <!-- 個人的年度代表馬 -->
    <script>
    // ▼ ここを書き換えるだけで内容を変えられます
    // horse: 馬名 / race: 決め手のレース / reason: 選んだ理由 / official: 公式の年度代表馬(違う年だけ書く)
    // pos: 閉じた時の写真の見せる位置(例: "center 20%" で上寄り、"center 60%" で下寄り) / image: 写真のパス
  const entries = {
    2000: { horse: "テイエムオペラオー", race: "有馬記念", reason: "2000年のテイエムオペラオーは、まさに「覇王」と呼ぶにふさわしい1年を送っていた。京都記念、阪神大賞典、天皇賞（春）、宝塚記念を制し、秋も京都大賞典、天皇賞（秋）、ジャパンカップと勝利。出走した7戦すべてを勝ち、残すは年間無敗を懸けた有馬記念のみとなった。迎えた有馬記念。中団でレースを進めたオペラオーだったが、勝負どころでは他馬に囲まれ、進路を塞がれてしまう。絶体絶命ともいえる状況だったが、和田竜二騎手はわずかな隙を見逃さず、馬群をこじ開けるようにして進出。直線では宿敵メイショウドトウとの激しい競り合いとなり、最後はハナ差で勝利をつかんだ。年間8戦8勝、うちGⅠ5勝。最後まで立ちはだかったライバルを退け、無敗で2000年を駆け抜けたオペラオー。その強さはもちろん、どんな状況でも諦めずに勝ち切る姿こそ、この有馬記念が今も語り継がれる理由だと思う。", official: "", image: "images/2000.png", pos: "center 30%" },
    2001: { horse: "ジャングルポケット", race: "ジャパンカップ", reason: "2001年のジャングルポケットは、皐月賞3着、日本ダービー1着とクラシック戦線で活躍し、世代の頂点に立った。秋は菊花賞で4着に敗れたものの、年末のジャパンカップで古馬の強豪に挑むこととなる。そこには前年の年間無敗を達成したテイエムオペラオーや、そのライバルであるメイショウドトウ、ナリタトップロードなどが顔をそろえていた。レースでは中団後方で脚を溜め、直線に向いてから末脚を発揮。前で抜け出しを図るテイエムオペラオーを追い詰め、ゴール前で並びかけると、最後はクビ差で差し切った。勝ちタイムは2分23秒8。3歳馬が歴史的な王者を破り、世代交代を印象づける勝利となった。前年の有馬記念で年間無敗を達成したオペラオーを、今度は3歳の新王者が打ち破る。この勝利は、ジャングルポケット自身の強さを証明しただけでなく、競馬界の主役が移り変わる瞬間を感じさせるものだった。世代を超えた名勝負として、今も語り継がれる一戦である。", official: "", image: "images/2001.png", pos: "center 30%" },
    2002: { horse: "ファインモーション", race: "秋華賞", reason: "2002年のファインモーションは、デビューから無敗のまま秋華賞に挑んだ。デビュー戦から連勝を重ね、夏には阿寒湖特別、秋にはローズステークスを制覇。わずか4戦で重賞初勝利を挙げ、5戦目で初のGⅠに挑むこととなった。単勝1.1倍の圧倒的な1番人気に支持され、その強さに大きな期待が寄せられていた。レースでは好位の5、6番手を追走し、3コーナー付近から徐々に進出。4コーナーでは早くも先頭に並びかけ、直線に入ると一気に後続を突き放した。最後まで脚色は衰えず、2着サクラヴィクトリアに3馬身半差をつけて圧勝。勝ちタイム1分58秒1は当時の秋華賞レコードだった。何より印象的なのは、その圧倒的な余裕と強さ。初のGⅠにもかかわらず、まるで格の違いを見せつけるかのような走りで無敗の5連勝を達成した。新たな女王の誕生を予感させる、圧巻のレースだった。", official: "", image: "images/2002.png", pos: "center 30%" },
    2003: { horse: "シンボリクリスエス", race: "有馬記念", reason: "2003年のシンボリクリスエスは、前年の有馬記念を制し、2003年も天皇賞（秋）を勝利。ジャパンカップでは3着に敗れたものの、年末の有馬記念で再び頂点を目指した。引退レースとなるこの一戦には、タップダンスシチーやゼンノロブロイなどの強豪が集結していた。レースでは中団でじっくりと脚を溜め、3コーナー過ぎから動き出す。直線に入ると一気に加速し、先頭に立ってからも後続との差を広げ続けた。2着リンカーンにつけた着差は、驚異の9馬身。勝ちタイム2分30秒5は当時のレコードを更新するものだった。引退レースでこれほどの圧勝を見せるとは、まさに規格外。連覇という偉業を成し遂げるだけでなく、自らの強さを最後の最後に改めて証明した。シンボリクリスエスの名を歴史に刻む、圧巻のラストランだった。", official: "", image: "images/2003.png", pos: "center 30%" },
    2004: { horse: "ゼンノロブロイ", race: "有馬記念", reason: "2004年のゼンノロブロイは、春こそGⅠ勝利に届かなかったものの、秋に入ると天皇賞（秋）、ジャパンカップを連勝。勢いそのままに有馬記念へと挑み、秋のGⅠ3連勝を懸けた。迎えた有馬記念では、タップダンスシチーが先頭を引っ張る展開の中、ゼンノロブロイは好位の2、3番手で追走。3コーナー過ぎからペースが上がると、逃げるタップダンスシチーを追いかけ、直線では2頭の激しい一騎打ちとなった。最後はゼンノロブロイが半馬身差で競り勝ち、勝ちタイム2分29秒5は前年のシンボリクリスエスの記録を1秒も更新するレコードとなった。天皇賞（秋）、ジャパンカップに続く秋の古馬王道路線GⅠ3連勝という偉業を達成。最後まで逃げ粘るタップダンスシチーを力でねじ伏せた姿は圧巻で、まさに2004年の競馬界を代表する王者にふさわしい勝利だった。", official: "", image: "images/2004.png", pos: "center 30%" },
    2005: { horse: "ハーツクライ", race: "有馬記念", reason: "2005年のハーツクライは、日本ダービー2着や宝塚記念2着、ジャパンカップ2着と、GⅠで何度も惜敗を経験していた。そんな中、年末の有馬記念では無敗の三冠馬ディープインパクトが圧倒的な1番人気に支持され、ハーツクライは4番人気という評価だった。レースでは、これまで追い込みを得意としていたハーツクライが、クリストフ・ルメール騎手の判断で先行集団につける意外な展開となる。直線では早めに抜け出して先頭に立ち、外から猛追するディープインパクトを半馬身差で振り切って勝利。悲願のGⅠ初制覇を果たし、ディープインパクトの無敗記録にも初めて土をつけた。これまであと一歩届かなかったハーツクライが、戦法を変える大胆な判断で大舞台を制したことが、このレースの大きな見どころだ。絶対王者と目されたディープインパクトを破り、新たな可能性を示した、競馬史に残る大金星だった。", official: "", image: "images/2005.png", pos: "center 30%" },
    2006: { horse: "ディープインパクト", race: "有馬記念", reason: "2006年のディープインパクトは、前年の有馬記念でハーツクライに敗れた悔しさを胸に、天皇賞（春）、宝塚記念、ジャパンカップを制して再び王者としての力を示していた。そして迎えた有馬記念は、現役最後のレース。単勝1.2倍の圧倒的な支持を集め、ラストランでの勝利に大きな期待が寄せられていた。レースでは後方からじっくりと脚を溜め、3コーナー過ぎから徐々に進出。直線に入ると、武豊騎手の合図に応えて一気に加速し、先頭に立っていたポップロックを残り200m付近で捉えると、最後は2馬身差をつけて圧勝した。前年はハーツクライに敗れた有馬記念で、今度は圧倒的な走りでリベンジを果たしたディープインパクト。通算14戦12勝、GⅠ7勝という輝かしい成績を残し、最後まで日本競馬の主役としてターフを駆け抜けた。直線で見せたあの伸びは、まさに英雄のラストランにふさわしいものだった。勝利の瞬間、競馬場を包んだ大歓声と「ありがとう」という思いが重なる、競馬史に残る名レースである。", official: "", image: "images/2006.png", pos: "center 30%" },
    2007: { horse: "ウオッカ", race: "日本ダービー", reason: "2007年のウオッカは、2歳時に阪神ジュベナイルフィリーズを制し、牝馬の頂点に立った。3歳初戦のチューリップ賞も快勝すると、桜花賞では圧倒的な1番人気に支持されたが、ダイワスカーレットに敗れて2着となる。そこで陣営が選んだ次の舞台は、牝馬限定戦ではなく、牡馬の強豪が集う日本ダービーだった。64年ぶりの牝馬によるダービー制覇を目指して迎えたレースでは、中団からレースを進め、直線で外へ持ち出すと力強く加速。先に抜け出したアサクサキングスを残り200m付近で捉え、最後は3馬身差をつけて圧勝した。牝馬が日本ダービーを制するのはクリフジ以来、実に64年ぶりの快挙だった。牡馬相手でもまったく引けを取らない走りで歴史を塗り替えたウオッカ。その勝利は、性別の壁を超えた強さを証明し、競馬史に深く刻まれる伝説となった。", official: "", image: "images/2007.png", pos: "center 30%" },
    2008: { horse: "ダイワスカーレット", race: "天皇賞秋", reason: "2008年のダイワスカーレットは、桜花賞、秋華賞、エリザベス女王杯、有馬記念を制し、牡馬相手の大舞台でも実力を示してきた名牝だった。前年の有馬記念以来となる復帰戦として天皇賞（秋）に挑み、ライバルのウオッカとの再対決が大きな注目を集めた。レースではスタートから先頭に立ち、1000m通過58秒7という速いペースで逃げる。直線に入っても脚色は衰えず、ウオッカやディープスカイが迫る中、最後まで先頭を譲らなかった。ゴール前ではウオッカと激しい叩き合いとなり、写真判定の結果、わずか2cm差でウオッカが勝利。ダイワスカーレットは惜しくも2着に敗れた。敗れはしたものの、約11か月ぶりの実戦でこれほどの走りを見せたことは驚異的だった。最後まで逃げ切ろうとする姿と、ウオッカとの壮絶な競り合いは、競馬史に残る名勝負として語り継がれている。", official: "", image: "images/2008.png", pos: "center 30%" },
    2009: { horse: "ドリームジャーニー", race: "有馬記念", reason: "2009年のドリームジャーニーは、春に宝塚記念を制し、父ステイゴールド譲りの勝負強さを見せていた。秋は天皇賞（秋）で6着に敗れたものの、年末の有馬記念で再びGⅠ制覇を狙う。対するは、天皇賞（秋）を制したカンパニーや、菊花賞馬スリーロールスなどの強豪たちだった。レースでは後方で脚を溜め、3コーナーから徐々に進出。直線では外から鋭い末脚を繰り出し、先に抜け出したブエナビスタやエアシェイディをまとめて差し切った。最後は2着ブエナビスタに1馬身半差をつけて勝利し、宝塚記念に続くグランプリ連覇を達成。小柄な馬体からは想像できない豪快な末脚で、年末の大舞台を制した。春と冬のグランプリを同一年に制するという偉業を成し遂げ、ドリームジャーニーの勝負強さを改めて印象づけた一戦だった。", official: "", image: "images/2009.png", pos: "center 30%" },
    2010: { horse: "ブエナビスタ", race: "天皇賞秋", reason: "2010年のブエナビスタは、前年に牝馬として圧倒的な実力を示し、2010年もヴィクトリアマイルと宝塚記念で好走するなど、現役最強クラスの存在として天皇賞（秋）に挑んだ。レースでは中団で折り合い、直線に入ると外から鋭い末脚を発揮。先に抜け出したペルーサやアーネストリーらを追い詰め、最後はペルーサを捉えて先頭でゴールした。2着ペルーサに2馬身差をつける完勝で、前年の天皇賞（秋）3着から雪辱を果たした。牡馬の強豪を相手に堂々と差し切る姿は、ブエナビスタの実力を改めて証明するものだった。どんな相手にも臆することなく、直線で確実に伸びてくる末脚。牝馬の枠を超えてトップホースとして君臨する、その強さが際立った一戦だった。", official: "", image: "images/2010.png", pos: "center 30%" },
    2011: { horse: "オルフェーヴル", race: "有馬記念", reason: "2011年のオルフェーヴルは、皐月賞、日本ダービー、菊花賞を制し、史上7頭目となるクラシック三冠を達成。圧倒的な強さを見せる一方、気性の激しさも持ち合わせており、どんな走りを見せるのか注目されていた。三冠達成後、年末の有馬記念では古馬の強豪に挑戦。レースでは中団で折り合い、3コーナーから徐々に進出すると、直線で力強く抜け出して先頭に立った。最後は2着エイシンフラッシュに3馬身差をつけて圧勝。3歳馬ながら古馬を相手に堂々と勝利し、三冠馬の実力を改めて証明した。春のクラシックから年末のグランプリまで駆け抜けたオルフェーヴル。その圧巻の勝利は、新時代の王者誕生を印象づけるものとなった。", official: "", image: "images/2011.png", pos: "center 30%" },
    2012: { horse: "ジェンティルドンナ", race: "ジャパンカップ", reason: "2012年のジェンティルドンナは、桜花賞、オークス、秋華賞を制し、史上4頭目となる牝馬三冠を達成。年末のジャパンカップでは、前年の三冠馬オルフェーヴルとの対決が実現し、大きな注目を集めた。レースでは好位で脚を溜め、直線に入ると先に抜け出したオルフェーヴルに並びかける。残り200m付近から2頭の激しい叩き合いとなり、互いに譲らないままゴールへ。最後はジェンティルドンナがハナ差で競り勝ち、3歳牝馬として歴史的な勝利を飾った。牡馬の頂点に立つ三冠馬を相手に、真っ向勝負で勝ち切った姿は圧巻だった。さらに、この勝利で史上初となる3歳牝馬によるジャパンカップ制覇を達成。世代を超えた王者同士の激闘は、競馬史に残る名勝負となった。", official: "", image: "images/2012.png", pos: "center 30%" },
    2013: { horse: "ロードカナロア", race: "スプリンターズステークス", reason: "2013年のロードカナロアは、前年のスプリンターズステークスと香港スプリントを制し、世界屈指のスプリンターとして君臨していた。2013年も高松宮記念を勝利し、秋のスプリンターズステークスでは史上初の連覇を目指して出走した。レースでは中団で脚を溜め、直線に入ると外から一気に加速。先に抜け出したハクサンムーンを追い詰め、ゴール前で鮮やかに差し切った。最後はハクサンムーンに半馬身差をつけて勝利し、スプリンターズステークス連覇を達成。さらに、この年の香港スプリントも制し、短距離界の絶対王者としての地位を揺るぎないものにした。最後まで衰えない末脚と勝負強さを見せつけた、ロードカナロアの強さを象徴する一戦だった。", official: "", image: "images/2013.png", pos: "center 30%" },
    2014: { horse: "ジャスタウェイ", race: "安田記念", reason: "2014年のジャスタウェイは、前年の天皇賞（秋）を圧勝し、ドバイデューティーフリーでも世界の強豪を相手に完勝。世界ランキング1位に評価されるほどの実力を示していた。帰国初戦となる安田記念では、海外遠征の疲れや悪天候による不良馬場も心配される中、圧倒的な1番人気を集めて出走した。レースでは道中で後方の厳しい位置取りとなり、直線に入っても前が壁になる絶体絶命の展開に。しかし、残りわずかな隙間を突いて猛然と末脚を爆発させると、先に抜け出していたグランプリボスを怒濤の追撃で強襲。ゴール前での熾烈な叩き合いをハナ差だけ制し、見事に劇的な逆転勝利をおさめた。海外GⅠ制覇の勢いをそのままに、泥んこの不良馬場や絶体絶命の展開をも跳ね返して日本のマイル王決定戦でも頂点に立ったジャスタウェイ。世界最強クラスの実力を国内でも証明し、その勝負強さと一瞬のチャンスを逃さない圧巻の末脚が光る一戦だった。", official: "", image: "images/2014.png", pos: "center 30%" },
    2015: { horse: "ドゥラメンテ", race: "日本ダービー", reason: "2015年のドゥラメンテは、皐月賞で直線に入ると外へ大きく膨れながらも、驚異的な末脚で差し切り勝ち。圧倒的な能力を見せつけ、日本ダービーでも主役として注目を集めた。迎えた日本ダービーでは、中団で脚を溜め、直線に入ると外から一気に加速。先に抜け出したサトノラーゼンらを力強く差し切り、最後は2着サトノラーゼンに1馬身半差をつけて優勝した。皐月賞に続く勝利で二冠を達成し、世代の頂点に立ったドゥラメンテ。圧倒的な瞬発力と勝負強さを見せつけたその走りは、三冠への期待を大きく膨らませるものだった。故障により菊花賞への出走は叶わなかったが、このダービーは世代屈指の才能を証明した一戦として記憶されている。", official: "", image: "images/2015.png", pos: "center 30%" },
    2016: { horse: "モーリス", race: "天皇賞秋", reason: "2016年のモーリスは、前年にマイルCSと香港マイルを制し、マイル界の絶対王者として君臨していた。2016年もチャンピオンズマイルや安田記念で好走し、秋には距離を2000mに延ばして天皇賞（秋）に挑戦。マイル王が中距離でも通用するのか、大きな注目を集めた。レースでは中団で折り合い、直線に入ると力強く加速。先に抜け出したエイシンヒカリを捉え、最後はリアルスティールとの競り合いを制して優勝した。勝ちタイムは1分59秒3。マイルを主戦場としてきた馬が、強豪の集う天皇賞（秋）でも頂点に立ったことは大きな驚きだった。距離の壁を感じさせない走りで、モーリスの能力の高さを改めて証明した一戦だった。", official: "", image: "images/2016.png", pos: "center 30%" },
    2017: { horse: "キタサンブラック", race: "天皇賞秋", reason: "2017年のキタサンブラックは、前年に続いて天皇賞（春）を制し、宝塚記念では9着に敗れたものの、秋の復帰戦となる天皇賞（秋）で再び王者の力を示そうとしていた。しかし、この年の天皇賞（秋）は台風の影響で大雨が降り続き、馬場は不良という過酷なコンディション。スタートでは出遅れてしまい、得意の先行策を取れず後方からの競馬となった。それでも武豊騎手は慌てずに馬群の中で脚を温存し、勝負どころから徐々に進出。直線では泥だらけになりながらも力強く伸び、最後はサトノクラウンらを突き放して2馬身差で勝利した。勝ちタイムは2分8秒3。大雨と不良馬場、さらに出遅れという不利を乗り越えての勝利は、キタサンブラックの底力を象徴するものだった。どんな状況でも簡単には崩れない王者の強さを見せつけ、引退の年に再び歴史的な勝利を刻んだ一戦だった。", official: "", image: "images/2017.png", pos: "center 30%" },
    2018: { horse: "オジュウチョウサン", race: "中山GJ", reason: "2018年のオジュウチョウサンは、障害レースで圧倒的な強さを誇り、前年の中山グランドジャンプに続いて中山大障害も制覇。障害界の絶対王者として、春の大一番である中山グランドジャンプに挑んだ。レースでは好位につけ、数々の障害を安定した飛越でクリア。最終障害を越えてからも脚色は衰えず、直線で後続を突き放して優勝した。2着馬に3馬身半差をつけ、同レース3連覇を達成。障害競走では飛越の技術だけでなく、スタミナや精神力も求められるが、オジュウチョウサンはそのすべてを高いレベルで備えていた。長い距離と数々の障害を乗り越え、最後まで王者の走りを貫いた姿は圧巻。障害競馬の歴史にその名を刻む、伝説的な勝利となった。", official: "", image: "images/2018.png", pos: "center 30%" },
    2019: { horse: "クロノジェネシス", race: "秋華賞", reason: "2019年のクロノジェネシスは、春の牝馬クラシックで桜花賞3着、オークス3着と惜しい競馬が続き、秋華賞で最後の一冠を狙った。迎えた本番では、スタートから中団で脚をため、勝負どころで徐々に進出。直線では外から力強く伸び、先に抜け出したカレンブーケドールをゴール前で差し切った。春の悔しさを晴らす見事な勝利で、牝馬三冠最終戦を制覇。大舞台で確かな末脚を発揮し、世代トップクラスの実力を証明した瞬間だった。", official: "", image: "images/2019.png", pos: "center 30%" },
    2020: { horse: "アーモンドアイ", race: "ジャパンカップ", reason: "2020年のアーモンドアイは、天皇賞・秋を制して史上初の芝GⅠ8勝を達成し、引退レースとしてジャパンカップに挑んだ。迎え撃つのは、無敗の三冠馬コントレイルと、同じく無敗で牝馬三冠を達成したデアリングタクト。三頭の三冠馬が顔をそろえる、競馬史に残る夢の対決となった。レースでは好位で流れに乗り、直線に入ると力強く抜け出す。猛追するコントレイルとデアリングタクトを振り切り、先頭でゴールを駆け抜けた。史上初の芝GⅠ9勝という偉業を達成し、有終の美を飾ったアーモンドアイ。最強のライバルたちを退けて引退を勝利で締めくくった、まさに女王のラストランだった。", official: "", image: "images/2020.png", pos: "center 30%" },
    2021: { horse: "コントレイル", race: "ジャパンカップ", reason: "2021年のコントレイルは、前年のジャパンカップでアーモンドアイ、デアリングタクトと歴史的な三強対決を演じて2着に敗れ、翌年の大阪杯でも3着と惜敗。その後、秋の天皇賞でも2着に敗れ、引退レースとなるジャパンカップで有終の美を目指した。レースでは好位につけ、直線で満を持して先頭へ。最後まで力強く脚を伸ばし、オーソリティの追撃を振り切って先頭でゴールした。無敗の三冠馬として歩んだ競走生活を、GⅠ5勝目で締めくくったコントレイル。父ディープインパクトから受け継いだ輝きを証明し、最後に再び王者の姿を見せつけた。", official: "", image: "images/2021.png", pos: "center 30%" },
    2022: { horse: "タイトルホルダー", race: "宝塚記念", reason: "2022年のタイトルホルダーは、天皇賞（春）で7馬身差の圧勝を飾り、勢いそのままにグランプリ・宝塚記念へ駒を進めた。ファン投票1位の期待を背負って迎えたレースでは、大逃げを打つパンサラッサを離れた2番手でぴったりとマーク。ハイペースの展開にも惑わされず、絶妙な手応えのまま最後の直線へ向かった。直線で力強く抜け出すと、後方から追いすがるヒシイグアスやデアリングタクトらの追撃を完全にシャットアウト。2着に2馬身半差をつける力強い走りで、従来の記録を大幅に更新する勝ち時計2分09秒7のコースレコードを叩き出して完勝した。天皇賞（春）に続くGⅠ連勝で、春の中長距離路線を完全制覇。展開に応じた自在性と圧倒的なスピード持続力を見せつけ、現役最強の座を揺るぎないものとした圧巻の一戦だった。", official: "", image: "images/2022.png", pos: "center 30%" },
    2023: { horse: "イクイノックス", race: "宝塚記念", reason: "2023年のイクイノックスは、ドバイシーマクラシックで圧巻の走りを披露し、世界最強の座を確かなものにすると、国内復帰戦となる宝塚記念に挑んだ。ファン投票1位に支持され、単勝1.3倍の圧倒的な人気を背負って迎えた大一番。レースでは中団でじっくりと脚をため、勝負どころから外を回って進出する。直線では力強く末脚を伸ばし、先に抜け出したスルーセブンシーズの猛追をクビ差で振り切って優勝。これでGⅠ4連勝を達成し、国内外の大舞台でその強さを改めて証明した。どんな展開でも勝ち切る底知れない能力を見せつけ、世界最強馬としての存在感をさらに高めた一戦だった。", official: "", image: "images/2023.png", pos: "center 30%" },
    2024: { horse: "ドウデュース", race: "有馬記念", reason: "2024年のドウデュースは、天皇賞・秋とジャパンカップを連勝し、秋の古馬中距離GⅠを制覇。迎えた有馬記念は、引退レースとして競走生活最後の舞台となった。ファン投票1位の支持を受けながら、レースでは後方でじっくりと脚をため、向正面から徐々に進出。4コーナーで外を回ると、直線では持ち前の豪快な末脚を発揮し、先に抜け出した馬たちを次々とかわして先頭へ。最後は2着のシャフリヤールに1馬身半差をつけ、見事に有終の美を飾った。これでGⅠ6勝目。幾度もの敗戦を乗り越え、最後の最後に中山の大舞台で輝きを放った姿は、多くのファンの心に刻まれる伝説のラストランとなった。", official: "", image: "images/2024.png", pos: "center 30%" },
    2025: { horse: "フォーエバーヤング", race: "BCクラシック", reason: "2025年のフォーエバーヤングは、サウジカップを制して世界の頂点に立つと、ドバイワールドカップでは惜しくも3着。それでも世界最高峰の舞台で戦い続け、次なる目標としてアメリカ競馬の最高峰、ブリーダーズカップ・クラシックに挑んだ。日本調教馬にとって厚い壁として立ちはだかってきたダートの本場で、歴史を変える走りが求められた。レースでは好スタートから積極的に前へ進み、逃げ馬を射程圏に入れた3番手で追走。勝負どころで早めに先頭へ立つと、直線でも力強く脚を伸ばし、前年の覇者シエラレオーネの猛追を半馬身差で振り切った。前年は3着に敗れたアメリカの最高峰で、ついに頂点へ。日本調教馬として初めてBCクラシックを制する歴史的快挙を成し遂げた。世界の強豪が集うダートの大舞台で、日本競馬の新たな可能性を切り開いた、歴史に残る勝利となった。", official: "", image: "images/2025.png", pos: "center 30%" }
  };

    (function () {
        var list = document.getElementById('hoyList');

        Object.keys(entries).forEach(function (year) {
            var e = entries[year];
            var d = document.createElement('details');
            d.className = 'hoy-card';

            var s = document.createElement('summary');
            s.innerHTML =
                '<span class="hoy-year">' + year + '<small>年</small></span>' +
                '<span class="hoy-main"><span class="hoy-name"></span><span class="hoy-race"></span></span>' +
                '<span class="hoy-arrow">▼</span>';
            s.querySelector('.hoy-name').textContent = e.horse;
            s.querySelector('.hoy-race').textContent = e.race;

            var b = document.createElement('div');
            b.className = 'hoy-body';

            // 写真があれば:閉じた時は背景、開いた時は全体を表示(なければ緑の背景のまま)
            if (e.image) {
                var probe = new Image();
                probe.onload = function () {
                    s.style.backgroundImage =
                        "linear-gradient(90deg, rgba(0,40,32,.85) 0%, rgba(0,40,32,.45) 55%, rgba(0,40,32,.1) 100%), url('" + e.image + "')";
                    s.style.backgroundPosition = e.pos || 'center 30%';

                    var full = document.createElement('img');
                    full.className = 'hoy-fullpic';
                    full.src = e.image;
                    full.alt = e.horse;
                    full.loading = 'lazy';
                    b.insertBefore(full, b.firstChild);
                };
                probe.src = e.image;
            }

            var p = document.createElement('p');
            p.textContent = e.reason;
            b.appendChild(p);
            if (e.official) {
                var o = document.createElement('div');
                o.className = 'hoy-official';
                o.textContent = '公式:' + e.official;
                b.appendChild(o);
            }

            d.appendChild(s);
            d.appendChild(b);
            list.appendChild(d);
        });

        document.getElementById('hoyOpenAll').onclick = function () {
            list.querySelectorAll('details').forEach(function (d) { d.open = true; });
        };
        document.getElementById('hoyCloseAll').onclick = function () {
            list.querySelectorAll('details').forEach(function (d) { d.open = false; });
        };
    })();
    </script>

    <!-- ハンバーガーメニュー制御 -->
    <script>
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const headerRight = document.getElementById('headerRight');
        const navOverlay = document.getElementById('navOverlay');

        function openMenu() {
            hamburgerBtn.classList.add('open');
            headerRight.classList.add('open');
            navOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            hamburgerBtn.classList.remove('open');
            headerRight.classList.remove('open');
            navOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        hamburgerBtn.addEventListener('click', () => {
            if (headerRight.classList.contains('open')) {
                closeMenu();
            } else {
                openMenu();
            }
        });

        navOverlay.addEventListener('click', closeMenu);

        // ドロワー内のリンクをタップしたら閉じる
        headerRight.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', closeMenu);
        });
    </script>

    <!-- フェードイン -->
    <script>
        const fadeEls = document.querySelectorAll('.fade-in');
        const fadeObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry, i) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, i * 100);
                    fadeObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08 });
        fadeEls.forEach(el => fadeObserver.observe(el));
    </script>
